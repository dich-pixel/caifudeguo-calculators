<!doctype html>
<!-- Two-instance Rocket honor host: bootstrap runs, embed is delayed. Not shipped. -->
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rocket delay host (two instances)</title>
    <style>
      body { margin: 0; background: #f0f0f1; font-family: system-ui, sans-serif; }
      #cbr-rocket-outside { padding: 12px 16px; background: #e2e4e7; }
    </style>
  </head>
  <body>
    <div id="cbr-rocket-outside">Parent chrome (click here to start delayed scripts)</div>
    <iframe class="caifu-buy-vs-rent" data-cbr-id="bvr1" src="./index.html?cbr_test=1" title="计算器 1" style="height:2400px;width:100%;border:0;display:block" scrolling="no" loading="eager"></iframe>
    <script src="./share-params.js"></script>
    <script src="./bootstrap.js"></script>
    <iframe class="caifu-buy-vs-rent" data-cbr-id="bvr2" src="./index.html?cbr_test=1" title="计算器 2" style="height:2400px;width:100%;border:0;display:block" scrolling="no" loading="eager"></iframe>
    <script src="./share-params.js"></script>
    <script src="./bootstrap.js"></script>

    <script type="rocketlazyloadscript">
      window.caifuBuyVsRent = {
        origins: [location.origin],
        settings: { testInterface: true, lang: 'zh' },
      }
    </script>
    <script type="rocketlazyloadscript" data-rocket-src="./embed.js"></script>
    <script>
      (function () {
        var started = false
        function startRocket(ev) {
          if (started) return
          if (ev && ev.target && ev.target.closest && ev.target.closest('iframe.caifu-buy-vs-rent')) return
          started = true
          document.querySelectorAll('script[type="rocketlazyloadscript"]').forEach(function (old) {
            var s = document.createElement('script')
            var src = old.getAttribute('data-rocket-src') || old.getAttribute('src')
            if (src) s.src = src
            else s.textContent = old.textContent
            old.parentNode.replaceChild(s, old)
          })
        }
        ;['click', 'touchstart', 'keydown'].forEach(function (type) {
          window.addEventListener(type, startRocket, true)
        })
        window.__cbrStartRocket = startRocket
      })()
    </script>

  </body>
</html>
